name: Apple native

# macOS runners are scarce (jobs queue, then get cancelled unacquired), so
# this workflow is kept off pull requests that cannot break the Swift side:
#   - pull requests run it only for the Apple app, the Apple tooling, the
#     xcframework build script and the committed C header (an FFI change);
#   - Rust-core changes run it once, after the merge to main;
#   - workflow_dispatch runs it on any branch on demand.
# Before merging a Rust PR that touches the FFI surface, run
# tools/apple/verify_local.sh on a Mac and paste its summary into the PR.
# The header-staleness check itself runs on Linux in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - 'xdremux/rust/**'
  pull_request:
    paths:
      - 'apps/apple/**'
      - 'tools/apple/**'
      - 'xdremux/rust/build_apple.sh'
      - 'xdremux/rust/include/**'
      - '.github/workflows/apple-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: Swift packages, CLI and macOS app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The default core encodes HEVC with VideoToolbox only, so there is no
      # x265 to fetch, build or cache here. (The vt+x265 core of the GitHub
      # release packages is built by tools/apple/package_release.sh on a
      # developer Mac.)
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cbindgen
            target
          key: cargo-apple-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cbindgen and xcodegen
        run: |
          command -v cbindgen >/dev/null || cargo install cbindgen --locked
          brew install xcodegen

      - name: Check the committed C header is current
        run: tools/apple/check_header.sh

      - name: Build XDRemuxCore.xcframework (macOS + simulator, arm64, VideoToolbox)
        run: XDREMUX_APPLE_SLICES="macos ios-sim" xdremux/rust/build_apple.sh

      # The local-transfer core (LocalSend v2) is its own workspace pinned
      # to Rust 1.97.1 and ships as a dynamic framework next to the core.
      - name: Set up Rust 1.97.1 for the transfer crate
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin, aarch64-apple-ios-sim

      - name: Cache transfer crate target
        uses: actions/cache@v6
        with:
          path: crates/xdremux-transfer-ffi/target
          key: transfer-apple-${{ runner.os }}-${{ hashFiles('crates/xdremux-transfer-ffi/Cargo.lock', 'crates/xdremux-transfer/Cargo.lock') }}

      - name: Build XDRemuxTransferCore.xcframework (macOS + simulator)
        run: XDREMUX_TRANSFER_SLICES="macos ios-sim" tools/apple/build_transfer_xcframework.sh

      - name: Check slice architectures
        run: |
          set -euo pipefail
          cat apps/apple/Frameworks/XDRemuxTransferCore.xcframework/BUILD_RECORD.txt
          fw=apps/apple/Frameworks/XDRemuxCore.xcframework
          cat "$fw/BUILD_RECORD.txt"
          grep -q '^hevc_backend=vt$' "$fw/BUILD_RECORD.txt"
          for lib in "$fw"/macos-*/libXDRemuxCore.a "$fw"/ios-*-simulator/libXDRemuxCore.a; do
            lipo -info "$lib" | tee /dev/stderr | grep -q "arm64"
            # A VideoToolbox-only core must not contain the static encoder.
            test "$(strings -a "$lib" | grep -ci x265 || true)" -eq 0
          done

      - name: Swift package tests
        working-directory: apps/apple/Packages/XDRemuxKit
        run: swift test

      - name: Build xdremux CLI and smoke it
        working-directory: apps/apple/Packages/XDRemuxKit
        run: |
          swift build -c release --product xdremux
          .build/release/xdremux --version
          .build/release/xdremux capabilities
          head -c 4096 /dev/urandom > "$RUNNER_TEMP/garbage.heic"
          if .build/release/xdremux inspect "$RUNNER_TEMP/garbage.heic"; then exit 1; fi

      - name: Build macOS app
        working-directory: apps/apple
        run: |
          xcodegen generate
          xcodebuild -project XDRemux.xcodeproj -scheme XDRemux \
            -destination 'platform=macOS,arch=arm64' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -5

      # The iOS build has its own failure modes (toolbar placement, HDR
      # preview, container paths, the Share Extension); build it for the
      # simulator so they surface in CI, not on a phone.
      - name: Build iOS app and Share Extension (simulator)
        working-directory: apps/apple
        run: |
          xcodebuild -project XDRemux.xcodeproj -scheme XDRemux \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -5
          ls build/Debug-iphonesimulator/XDRemux.app/PlugIns 2>/dev/null \
            || find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/XDRemux.app/PlugIns/XDRemuxShare.appex' -maxdepth 8 | grep -q appex
