name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-build-and-test:
    runs-on: macos-latest
    env:
      # Vendored x265 is gitignored; use the ffmpeg-subprocess fallback for
      # CI builds (same as the CI workflow's smoke job).
      XDREMUX_USE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rustflags: ""
          # v2 denies warnings via CARGO_BUILD_WARNINGS by default; keep
          # warnings non-fatal as before (rustflags "" did this under v1).
          build-warnings: ""

      - name: Install ffmpeg (encoder fallback)
        run: brew install ffmpeg

      - name: Build workspace
        run: cargo build --workspace

      - name: Run xdremux-core tests (skip ffmpeg & path-dependent tests)
        run: cargo test -p xdremux-core --lib -- --skip dump_diagnostics --skip compare_py_rust --skip convert_photo --skip convert_121521 --skip hevc_tile

      - name: Run conformance tests
        run: cargo test -p xdremux-conformance

  conformance-inspect:
    runs-on: macos-latest
    needs: rust-build-and-test
    env:
      XDREMUX_USE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rustflags: ""
          # v2 denies warnings via CARGO_BUILD_WARNINGS by default; keep
          # warnings non-fatal as before (rustflags "" did this under v1).
          build-warnings: ""

      - name: Build workspace
        run: cargo build --workspace

      - name: Run driver (inspect only, no ffmpeg)
        run: |
          echo '{"test": true}' > /dev/null  # placeholder
        # Full driver needs external sample files and ffmpeg.
        # Once sample fixtures are hosted, uncomment:
        # python3 tests/conformance/driver.py \
        #   --sample-dir <sample-dir> \
        #   --skip-convert \
        #   --out-report conformance_report.md
