name: Apple native

on:
  push:
    branches: [main]
    paths:
      - 'apps/apple/**'
      - 'xdremux/rust/**'
      - 'tools/apple/**'
      - '.github/workflows/apple-ci.yml'
  pull_request:
    paths:
      - 'apps/apple/**'
      - 'xdremux/rust/**'
      - 'tools/apple/**'
      - '.github/workflows/apple-ci.yml'
  workflow_dispatch:

env:
  X265_TAG: 4.2

jobs:
  macos:
    name: Swift packages, CLI and macOS app
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same vendored layout as the release job, plus the Main10 archive that
      # build_apple.sh bundles for the Styles linear thumbnail.
      - name: Restore x265 build
        id: x265-cache
        uses: actions/cache@v4
        with:
          path: xdremux/rust/vendor/x265
          # Bumped whenever build_apple.sh needs more archives: this key
          # covers desktop + simulator, arm64 + x86_64, 8-bit + Main10
          # (build_apple.sh builds the missing ones on a cache miss).
          key: x265-macos-apple-${{ env.X265_TAG }}-10bit-universal-sim

      - name: Build x265
        if: steps.x265-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$X265_TAG" \
            https://bitbucket.org/multicoreware/x265_git.git \
            xdremux/rust/vendor/x265
          mkdir -p xdremux/rust/vendor/x265/include
          cp xdremux/rust/vendor/x265/source/x265.h xdremux/rust/vendor/x265/include/x265.h
          cmake -S xdremux/rust/vendor/x265/source -B xdremux/rust/vendor/x265/build_desktop \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_ASSEMBLY=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build xdremux/rust/vendor/x265/build_desktop --target x265-static -j4
          cp xdremux/rust/vendor/x265/build_desktop/x265_config.h xdremux/rust/vendor/x265/include/x265_config.h
          cmake -S xdremux/rust/vendor/x265/source -B xdremux/rust/vendor/x265/build_desktop_10bit \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_ASSEMBLY=OFF \
            -DHIGH_BIT_DEPTH=ON -DEXPORT_C_API=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build xdremux/rust/vendor/x265/build_desktop_10bit --target x265-static -j4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cbindgen
            target
          key: cargo-apple-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cbindgen and xcodegen
        run: |
          command -v cbindgen >/dev/null || cargo install cbindgen --locked
          brew install xcodegen

      - name: Check the committed C header is current
        run: tools/apple/check_header.sh

      - name: Build XDRemuxCore.xcframework (macOS + simulator, arm64 + x86_64)
        run: XDREMUX_APPLE_SLICES="macos ios-sim" xdremux/rust/build_apple.sh

      - name: Check slice architectures
        run: |
          set -euo pipefail
          fw=apps/apple/Frameworks/XDRemuxCore.xcframework
          cat "$fw/BUILD_RECORD.txt"
          for lib in "$fw"/macos-*/libXDRemuxCore.a "$fw"/ios-*-simulator/libXDRemuxCore.a; do
            lipo -info "$lib" | tee /dev/stderr | grep -q "x86_64" && lipo -info "$lib" | grep -q "arm64"
          done

      - name: Swift package tests
        working-directory: apps/apple/Packages/XDRemuxKit
        run: swift test

      - name: Build xdremux CLI and smoke it
        working-directory: apps/apple/Packages/XDRemuxKit
        run: |
          swift build -c release --product xdremux
          .build/release/xdremux --version
          .build/release/xdremux capabilities
          head -c 4096 /dev/urandom > "$RUNNER_TEMP/garbage.heic"
          if .build/release/xdremux inspect "$RUNNER_TEMP/garbage.heic"; then exit 1; fi

      - name: Build macOS app
        working-directory: apps/apple
        run: |
          xcodegen generate
          xcodebuild -project XDRemux.xcodeproj -scheme XDRemux \
            -destination 'platform=macOS,arch=arm64' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -5

      # The iOS build has its own failure modes (toolbar placement, HDR
      # preview, container paths, the Share Extension); build it for the
      # simulator so they surface in CI, not on a phone.
      - name: Build iOS app and Share Extension (simulator)
        working-directory: apps/apple
        run: |
          xcodebuild -project XDRemux.xcodeproj -scheme XDRemux \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -5
          ls build/Debug-iphonesimulator/XDRemux.app/PlugIns 2>/dev/null \
            || find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/XDRemux.app/PlugIns/XDRemuxShare.appex' -maxdepth 8 | grep -q appex
