[package]
name = "xdremux-transfer-poc"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# Deliberately separate from the image-engine workspace and lockfile.
[workspace]

[features]
default = ["transport"]
transport = ["dep:localsend", "dep:anyhow", "dep:clap", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tokio-util", "dep:uuid"]

[dependencies]
localsend = { path = ".upstream/packages/core", default-features = false, features = ["http", "multicast"], optional = true }
anyhow = { version = "1.0", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.53", features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["io", "rt"], optional = true }
uuid = { version = "1.24", features = ["v4"], optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
