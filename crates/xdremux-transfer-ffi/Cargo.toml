[package]
name = "xdremux-transfer-ffi"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace]
members = ["."]

[lib]
name = "xdremux_transfer"
crate-type = ["cdylib", "rlib"]

[dependencies]
transfer-core = { package = "xdremux-transfer", path = "../xdremux-transfer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.24", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "unwind"
