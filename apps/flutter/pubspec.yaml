name: xdremux
description: XDRemux cross-platform ProXDR HEIC to ISO 21496-1 HDR converter
publish_to: 'none'

version: 0.3.1+19

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # FFI bridge to Rust core
  ffi: ^2.1.0

  # File/folder picking across platforms
  file_picker: ^8.0.0

  # Standard paths (downloads, cache, etc.)
  path_provider: ^2.1.0

  # Permissions on Android/iOS
  permission_handler: any  # OHOS fork reports 12.0.1

  # Persistent user settings
  shared_preferences: ^2.2.0

  # Save images/videos to system gallery (MediaStore on Android)
  gal: ^2.3.0

  # Share files via system share sheet (ACTION_SEND)
  share_plus: ^10.0.0

  # Receive files shared from other apps (ACTION_SEND/SEND_MULTIPLE)
  # OHOS: pinned to the CPF-Flutter ohos fork (br_v1.8.1_ohos).
  receive_sharing_intent:
    path: third_party/ohos/receive_sharing_intent

  # System notifications on batch conversion completion (Windows + Android)
  flutter_local_notifications: any  # OHOS fork (br_v19.5.0_ohos) reports 17.1.0; stock resolves latest elsewhere

  # Android foreground service for background conversion
  # OHOS: CPF-Flutter ohos fork master (upstream ^11 requires Flutter 3.47).
  flutter_foreground_task:
    path: third_party/ohos/flutter_foreground_task

  # Open files with system default app
  open_filex: ^4.5.0

  # Cupertino icons
  cupertino_icons: ^1.0.8

  # HTTP client for update checks
  http: ^1.6.0

  # App version info for update checks
  package_info_plus: ^9.0.1

  # Open release page in browser
  url_launcher: any  # OHOS fork reports 6.1.12

  # Windows system tray (minimize to tray during long batches)
  tray_manager: ^0.5.3

  # Win32 ShowWindow/FindWindow for tray hide/restore (Windows)
  win32: ^5.15.0

# OHOS (OpenHarmony NEXT): CPF-Flutter community forks add the ohos platform
# implementation. Stock versions of these plugins either lack ohos support or
# require a newer Flutter SDK than the ohos fork provides.
dependency_overrides:
  path_provider:
    path: third_party/ohos/path_provider
  shared_preferences:
    path: third_party/ohos/shared_preferences
  url_launcher:
    path: third_party/ohos/url_launcher
  file_picker:
    path: third_party/ohos/file_picker
  flutter_local_notifications:
    path: third_party/ohos/flutter_local_notifications
  open_filex:
    path: third_party/ohos/open_filex
  permission_handler:
    path: third_party/ohos/permission_handler/permission_handler
  path_provider_ohos:
    path: third_party/ohos/path_provider_ohos
  shared_preferences_ohos:
    path: third_party/ohos/shared_preferences_ohos
  url_launcher_ohos:
    path: third_party/ohos/url_launcher_ohos

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Windows MSIX installer packaging (dart run msix:create)
  msix: ^3.18.0

flutter:
  uses-material-design: true

  # Rust core DLL is bundled at build time for Windows;
  # Android copies the .so into jniLibs via Gradle hooks.
  # No explicit asset entries needed for the dynamic library.

# MSIX installer configuration (Windows).
# Build with: flutter build windows --release && dart run msix:create
msix_config:
  display_name: XDRemux
  publisher_display_name: BeetMan
  identity_name: io.github.beetman.xdremux
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
