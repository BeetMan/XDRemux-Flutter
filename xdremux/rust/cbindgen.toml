# C header for the xdremux-core C ABI (consumed by the native Apple app via
# include/module.modulemap; the HarmonyOS N-API bridge may adopt it later).
#
# Regenerate after changing any `extern "C"` export or `#[repr(C)]` type in
# src/lib.rs:
#
#   cargo install cbindgen
#   cbindgen --config cbindgen.toml --crate xdremux-core --output include/xdremux_core.h
#
# The header is committed so consumers do not need cbindgen installed; CI
# checks that it is up to date (see tools/apple/check_header.sh).
language = "C"
include_guard = "XDREMUX_CORE_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
header = """/* Generated by cbindgen from xdremux/rust/src/lib.rs. Do not edit by hand.
 *
 * Ownership rules (see docs/architecture/ffi-contract.md):
 *  - `char *` returned by a function is owned by Rust; free with xdremux_free_string.
 *  - Structs returned by value own their pointer fields; release them with the
 *    matching xdremux_free_* function exactly once.
 *  - Paths are UTF-8 C strings. Rust never panics across this boundary; errors
 *    come back as a JSON report with `success:false` and `errorMessage`.
 */"""
sys_includes = ["stdbool.h", "stdint.h", "stddef.h"]
no_includes = true
usize_is_size_t = true

[parse]
parse_deps = false

[defines]
"xdremux_ffmpeg_fallback" = "XDREMUX_FFMPEG_FALLBACK"
"xdremux_main10" = "XDREMUX_MAIN10"

[export]
item_types = ["functions", "structs", "enums", "typedefs", "opaque"]
# cbindgen also scans the `extern "C" { ... }` import blocks in x265_ffi.rs
# (libx265 and the C/C++ helpers in x265_helper.c / x265_10bit_bridge.cpp).
# Those are internal link-time dependencies, not part of the public ABI.
exclude = [
  "x265_param", "x265_picture", "x265_encoder", "x265_nal",
  "x265_param_alloc", "x265_param_free", "x265_param_default_preset",
  "x265_param_apply_profile", "x265_param_parse", "x265_picture_alloc",
  "x265_picture_free", "x265_picture_init", "x265_encoder_open_216",
  "x265_encoder_encode", "x265_encoder_close", "x265_cleanup",
  "xdremux_param_set_basic", "xdremux_pic_set_planes", "xdremux_pic_set_pts",
  "xdremux_10bit_available", "xdremux_encode_10bit_planes", "xdremux_free_stream",
  "StyleLayers",
]

[fn]
args = "vertical"
