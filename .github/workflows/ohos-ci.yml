name: OHOS CI experiment

# Feasibility probe: build the OHOS hap on a Linux runner using the public
# OpenHarmony SDK (openharmony-rs/setup-ohos-sdk) + hvigor from Huawei's npm
# registry. Unsigned output - signing still requires DevEco/Huawei account.

on:
  workflow_dispatch:

jobs:
  ohos-hap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenHarmony SDK
        id: ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: '6.1'
          fixup-path: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Build Rust core for OHOS
        run: |
          set -euxo pipefail
          if [ ! -f xdremux/rust/vendor/x265/source/CMakeLists.txt ]; then
            git clone --depth 1 --branch 4.2 \
              https://bitbucket.org/multicoreware/x265_git.git \
              xdremux/rust/vendor/x265
            mkdir -p xdremux/rust/vendor/x265/include
            cp xdremux/rust/vendor/x265/source/x265.h \
              xdremux/rust/vendor/x265/include/x265.h
          fi
          OHOS_NATIVE="${{ steps.ohos-sdk.outputs.ohos_sdk_native }}" \
            bash xdremux/rust/build_ohos.sh
          ls -la target/aarch64-unknown-linux-ohos/release/libxdremux_core.so

      - name: Clone CPF-Flutter fork
        run: |
          git clone --depth 1 --branch oh-3.41.9-release \
            https://atomgit.com/CPF-Flutter/flutter_flutter.git "$HOME/flutter-ohos"
          cd "$HOME/flutter-ohos"
          git fetch --deepen=2000 origin oh-3.41.9-release --tags
          export PATH="$HOME/flutter-ohos/bin:$PATH"
          flutter --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install hvigor from Huawei npm registry
        run: |
          npm install -g @ohos/hvigor @ohos/hvigor-ohos-plugin \
            --registry=https://repo.harmonyos.com/npm/
          which hvigorw || npm ls -g --registry=https://repo.harmonyos.com/npm/

      - name: Vendored OHOS plugins
        run: bash tools/ohos/fetch_plugins.sh

      - name: Build unsigned hap
        env:
          OHOS_SDK_HOME: /home/runner/ohos-sdk-root
          HOS_SDK_HOME: /home/runner/ohos-sdk-root
          DEVECO_SDK_HOME: /home/runner/ohos-sdk-root
          OHOS_NATIVE: ${{ steps.ohos-sdk.outputs.ohos_sdk_native }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/flutter-ohos/bin:$PATH"
          # The flutter tool enumerates <OHOS_SDK_HOME>/<numeric-api>/toolchains;
          # setup-ohos-sdk's layout is <root>/<os>/<api>/<component>, so mirror
          # it into the numeric layout the tool expects.
          mkdir -p /home/runner/ohos-sdk-root
          ln -sfn "$(dirname "$OHOS_NATIVE")" /home/runner/ohos-sdk-root/23
          echo "== toolchains contents:"
          ls /home/runner/ohos-sdk-root/23/toolchains/ | head -20
          echo "== hdc present?"
          ls /home/runner/ohos-sdk-root/23/toolchains/hdc 2>&1 || echo "NO hdc in public SDK"
          cd apps/flutter
          cp pubspec.ohos.yaml pubspec.yaml
          flutter pub get
          # The ohos/package.json references the fork's flutter-hvigor-plugin
          # via a Windows file path; repoint it at the CI clone.
          cd ohos
          sed -i "s|file:.*flutter_tools.\\\\hvigor|file:$HOME/flutter-ohos/packages/flutter_tools/hvigor|" package.json
          sed -i "s|file:.*flutter_tools/hvigor|file:$HOME/flutter-ohos/packages/flutter_tools/hvigor|" package.json
          cat package.json
          # Scope @ohos/* to Huawei's registry; everything else stays on npmjs.
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> .npmrc
          npm install @ohos/hvigor @ohos/hvigor-ohos-plugin
          npm install
          # Run the build via the wrapper checked into the repo (DevEco's
          # hvigorw is not on PATH in CI).
          bash ./hvigorw assembleHap -p product=default -p buildMode=debug --no-daemon
          find . -name "*.hap" -ls

      - name: Upload hap
        uses: actions/upload-artifact@v4
        with:
          name: ohos-hap-probe
          path: apps/flutter/ohos/entry/build/default/outputs/default/*.hap
          if-no-files-found: error
