[package]
name = "xdremux-core"
version = "0.2.6"
edition = "2021"
authors = ["BeetMan"]
license = "MIT"
description = "XDRemux cross-platform HEIC conversion core (Rust)"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# Custom cfg emitted by build.rs when XDREMUX_USE_FFMPEG=1 (ffmpeg subprocess
# fallback instead of the default x265 static-linked encoder).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(xdremux_ffmpeg_fallback)", "cfg(xdremux_gm_420)"] }

[dependencies]
jpeg-decoder = "0.3"

[build-dependencies]
cc = "1"

