# xcodegen spec for the native Apple app. Generate the Xcode project with:
#
#   cd apps/apple && xcodegen generate
#
# The .xcodeproj is ignored by Git; this file is the source of truth.
# Prerequisite: xdremux/rust/build_apple.sh has produced
# Frameworks/XDRemuxCore.xcframework (also ignored).
name: XDRemux
options:
  bundleIdPrefix: io.github.beetman
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  XDRemuxKit:
    path: Packages/XDRemuxKit
targets:
  XDRemux:
    type: application
    # One multiplatform target; platform differences live behind #if os().
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: XDRemuxKit
        product: XDRemuxKit
      - package: XDRemuxKit
        product: XDRemuxModel
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: XDRemux
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.photography
        # Viewer-rank document types: Finder "Open With", Dock drop, iOS "Open in".
        CFBundleDocumentTypes:
          - CFBundleTypeName: HEIF image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.heic, public.heif]
          - CFBundleTypeName: JPEG image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg]
        NSPhotoLibraryAddUsageDescription: 转换结果写入照片库需要此权限。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/XDRemux.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        # Independent identity from the Flutter app (io.github.beetman.xdremux),
        # so both can be installed side by side (plan §5).
        PRODUCT_BUNDLE_IDENTIFIER: io.github.beetman.xdremux.swiftui
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        GENERATE_INFOPLIST_FILE: false
        # x265 is C++; the Rust staticlib carries no link flags of its own.
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        # build_apple.sh produces arm64-only slices (Apple Silicon host, no
        # x86_64 Rust/x265 builds); keep the simulator build to arm64 too.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "-"
