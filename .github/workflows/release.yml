name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Project memory: pub packages are fetched through the China mirror.
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  X265_TAG: 4.2
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore x265 build
        id: x265-cache
        uses: actions/cache@v4
        with:
          path: xdremux/rust/vendor/x265
          key: x265-windows-${{ env.X265_TAG }}-asm
          # Release runs on a tag ref, and actions/cache scopes caches to the
          # ref: a tag run cannot hit a cache saved by a main-branch run even
          # with an identical key. restore-keys does a prefix match that is not
          # ref-scoped, so it falls back to the latest main-branch x265 build
          # instead of recompiling x265 from scratch on every release.
          restore-keys: |
            x265-windows-${{ env.X265_TAG }}-asm

      - name: Install NASM
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Build x265
        if: steps.x265-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:X265_TAG `
            https://bitbucket.org/multicoreware/x265_git.git `
            xdremux/rust/vendor/x265
          New-Item -ItemType Directory -Force `
            xdremux/rust/vendor/x265/include | Out-Null
          Copy-Item xdremux/rust/vendor/x265/source/x265.h `
            xdremux/rust/vendor/x265/include/x265.h
          cmake -S xdremux/rust/vendor/x265/source `
            -B xdremux/rust/vendor/x265/build_windows `
            -G 'Visual Studio 17 2022' -A x64 `
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF `
            -DXDREMUX_SKIP_RC=ON
          cmake --build xdremux/rust/vendor/x265/build_windows `
            --config Release --target x265-static
          Copy-Item xdremux/rust/vendor/x265/build_windows/x265_config.h `
            xdremux/rust/vendor/x265/include/x265_config.h

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^[vV]', ''
          # Strip a pre-release suffix (-pre.N) for the numeric checks; pubspec
          # carries the plain semver, the tag marks it pre-release.
          $baseVersion = ($version -replace '-.*$', '')
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must look like v0.1.1 or v0.1.1-pre.1, got ${{ github.ref_name }}"
          }
          $pubspecVersion = (Select-String -Path apps/flutter/pubspec.yaml -Pattern '^version:\s*(\S+)' ).Matches.Groups[1].Value
          $pubspecName = $pubspecVersion.Split('+')[0]
          if ($pubspecName -ne $baseVersion) {
            throw "Release tag $version does not match pubspec version $pubspecName"
          }
          "APP_VERSION=$baseVersion" >> $env:GITHUB_ENV
          # Full tag version (with -pre.N suffix) is used for asset naming,
          # e.g. XDRemux-Windows-0.3.0-pre.1-Setup.exe.
          "TAG_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Rust core
        run: cargo build -p xdremux-core --release

      - name: Install Dart dependencies
        working-directory: apps/flutter
        run: flutter pub get

      # path_provider_android brings the jni FFI package into Flutter's
      # generated Windows plugin list, but Windows does not ship a JVM.
      - name: Exclude Android JNI plugin from Windows build
        shell: pwsh
        run: |
          $plugins = 'apps/flutter/windows/flutter/generated_plugins.cmake'
          (Get-Content $plugins) | Where-Object { $_ -notmatch '^\s+jni\s*$' } | Set-Content $plugins

      - name: Build Windows app
        working-directory: apps/flutter
        run: flutter build windows --release --build-name="$env:APP_VERSION"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler was not found on the runner'
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" tools/installer/xdremux.iss

      - name: Rename installer for release
        shell: pwsh
        run: |
          $src = "apps/flutter/build/installer/XDRemuxSetup-$env:APP_VERSION.exe"
          $dst = "apps/flutter/build/installer/XDRemux-Windows-$env:TAG_VERSION-Setup.exe"
          Copy-Item $src $dst

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/flutter/build/installer/XDRemux-Windows-${{ env.TAG_VERSION }}-Setup.exe
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 installer
    runs-on: windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore x265 build
        id: x265-cache
        uses: actions/cache@v4
        with:
          path: xdremux/rust/vendor/x265
          key: x265-windows-arm64-${{ env.X265_TAG }}
          # See the x64 job: tag runs cannot hit ref-scoped main-branch
          # caches, so restore-keys falls back to the latest main build.
          restore-keys: |
            x265-windows-arm64-${{ env.X265_TAG }}

      - name: Build x265
        if: steps.x265-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:X265_TAG `
            https://bitbucket.org/multicoreware/x265_git.git `
            xdremux/rust/vendor/x265
          New-Item -ItemType Directory -Force `
            xdremux/rust/vendor/x265/include | Out-Null
          Copy-Item xdremux/rust/vendor/x265/source/x265.h `
            xdremux/rust/vendor/x265/include/x265.h
          # x265's assembly only covers x86 (NASM) and aarch64-with-GNU-as;
          # MSVC ARM64 gets the portable C path.
          cmake -S xdremux/rust/vendor/x265/source `
            -B xdremux/rust/vendor/x265/build_windows `
            -G 'Visual Studio 17 2022' -A ARM64 `
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF `
            -DENABLE_ASSEMBLY=OFF `
            -DXDREMUX_SKIP_RC=ON
          cmake --build xdremux/rust/vendor/x265/build_windows `
            --config Release --target x265-static
          Copy-Item xdremux/rust/vendor/x265/build_windows/x265_config.h `
            xdremux/rust/vendor/x265/include/x265_config.h

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          # The Windows Flutter SDK is x64-only and runs emulated on this
          # runner, but `flutter build windows` produces a native ARM64 app.
          architecture: x64
          cache: true

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^[vV]', ''
          $baseVersion = ($version -replace '-.*$', '')
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must look like v0.1.1 or v0.1.1-pre.1, got ${{ github.ref_name }}"
          }
          $pubspecVersion = (Select-String -Path apps/flutter/pubspec.yaml -Pattern '^version:\s*(\S+)' ).Matches.Groups[1].Value
          $pubspecName = $pubspecVersion.Split('+')[0]
          if ($pubspecName -ne $baseVersion) {
            throw "Release tag $version does not match pubspec version $pubspecName"
          }
          "APP_VERSION=$baseVersion" >> $env:GITHUB_ENV
          "TAG_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Rust core
        run: cargo build -p xdremux-core --release

      - name: Install Dart dependencies
        working-directory: apps/flutter
        run: flutter pub get

      # path_provider_android brings the jni FFI package into Flutter's
      # generated Windows plugin list, but Windows does not ship a JVM.
      - name: Exclude Android JNI plugin from Windows build
        shell: pwsh
        run: |
          $plugins = 'apps/flutter/windows/flutter/generated_plugins.cmake'
          (Get-Content $plugins) | Where-Object { $_ -notmatch '^\s+jni\s*$' } | Set-Content $plugins

      - name: Build Windows app
        working-directory: apps/flutter
        run: flutter build windows --release --build-name="$env:APP_VERSION"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler was not found on the runner'
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DBuildArch=arm64" tools/installer/xdremux.iss

      - name: Rename installer for release
        shell: pwsh
        run: |
          $src = "apps/flutter/build/installer/XDRemuxSetup-arm64-$env:APP_VERSION.exe"
          $dst = "apps/flutter/build/installer/XDRemux-Windows-arm64-$env:TAG_VERSION-Setup.exe"
          Copy-Item $src $dst

      - name: Upload Windows ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-installer
          path: apps/flutter/build/installer/XDRemux-Windows-arm64-${{ env.TAG_VERSION }}-Setup.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Restore x265 build
        id: x265-cache
        uses: actions/cache@v4
        with:
          path: xdremux/rust/vendor/x265
          key: x265-android-arm64-${{ env.X265_TAG }}-asm-ndk-v3-${{ env.ANDROID_NDK_VERSION }}
          # Tag-triggered runs cannot hit main-branch caches (see the Windows
          # job above); restore-keys falls back to the latest main-branch build.
          restore-keys: |
            x265-android-arm64-${{ env.X265_TAG }}-asm-ndk-v3-${{ env.ANDROID_NDK_VERSION }}

      - name: Build x265
        if: steps.x265-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          git clone --depth 1 --branch "$X265_TAG" \
            https://bitbucket.org/multicoreware/x265_git.git \
            xdremux/rust/vendor/x265
          mkdir -p xdremux/rust/vendor/x265/include
          cp xdremux/rust/vendor/x265/source/x265.h \
            xdremux/rust/vendor/x265/include/x265.h
          # x265's add_custom_command for .S files expands ${CMAKE_CXX_COMPILER}
          # to the NDK's bare clang++ (x86_64 host), not the aarch64 wrapper,
          # so -march=armv8-a hits "unknown target CPU". Patch the custom
          # commands to cross-compile with an explicit --target. The NDK CMake
          # already sets CMAKE_CXX_COMPILER_TARGET to the right triple.
          sed -i \
            's|ARGS ${ARM_ARGS} ${ASM_FLAGS} ${AARCH64_NEON_FLAG}|ARGS ${ARM_ARGS} ${ASM_FLAGS} --target=${CMAKE_CXX_COMPILER_TARGET} ${AARCH64_NEON_FLAG}|; s|ARGS ${ARM_ARGS} ${ASM_FLAGS} ${AARCH64_NEON_DOTPROD_FLAG}|ARGS ${ARM_ARGS} ${ASM_FLAGS} --target=${CMAKE_CXX_COMPILER_TARGET} ${AARCH64_NEON_DOTPROD_FLAG}|; s|ARGS ${ARM_ARGS} ${ASM_FLAGS} ${AARCH64_NEON_I8MM_FLAG}|ARGS ${ARM_ARGS} ${ASM_FLAGS} --target=${CMAKE_CXX_COMPILER_TARGET} ${AARCH64_NEON_I8MM_FLAG}|' \
            xdremux/rust/vendor/x265/source/CMakeLists.txt
          cmake -S xdremux/rust/vendor/x265/source \
            -B xdremux/rust/vendor/x265/build_android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DENABLE_SVE=OFF \
            -DENABLE_SVE2=OFF \
            -DENABLE_SVE2_BITPERM=OFF \
            -DXDREMUX_SKIP_RC=ON
          cmake --build xdremux/rust/vendor/x265/build_android \
            --target x265-static --parallel 2
          cp xdremux/rust/vendor/x265/build_android/x265_config.h \
            xdremux/rust/vendor/x265/include/x265_config.h

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Resolve release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Strip a pre-release suffix (-pre.N) for the numeric version checks;
          # pubspec carries the plain semver, the tag marks it pre-release.
          base_version="${version%%-*}"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v0.1.1 or v0.1.1-pre.1, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          pubspec_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' apps/flutter/pubspec.yaml | head -n1)"
          pubspec_name="${pubspec_version%%+*}"
          pubspec_code="${pubspec_version##*+}"
          if [[ "$pubspec_name" != "$base_version" ]]; then
            echo "Release tag $version does not match pubspec version $pubspec_name" >&2
            exit 1
          fi
          if [[ ! "$pubspec_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "pubspec build number must be a positive integer, got $pubspec_code" >&2
            exit 1
          fi
          echo "APP_VERSION=$base_version" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$pubspec_code" >> "$GITHUB_ENV"
          # Full tag version (with -pre.N suffix) is used for asset naming,
          # e.g. XDRemux-Android-0.3.0-pre.1.apk.
          echo "TAG_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build Rust Android library
        working-directory: xdremux/rust
        run: cargo ndk -t arm64-v8a -o ../../apps/flutter/android/app/src/main/jniLibs build --release

      - name: Bundle Android C++ runtime
        shell: bash
        run: |
          set -euxo pipefail
          runtime="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$runtime"
          cp "$runtime" apps/flutter/android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Install Dart dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing GitHub Actions secret: $variable" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/flutter/android/xdremux-release.keystore
          printf 'storeFile=xdremux-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > apps/flutter/android/key.properties
          chmod 600 apps/flutter/android/xdremux-release.keystore apps/flutter/android/key.properties
          echo 'XDREMUX_REQUIRE_RELEASE_SIGNING=true' >> "$GITHUB_ENV"

      - name: Build Android APK
        working-directory: apps/flutter
        run: flutter build apk --release --build-name="$APP_VERSION" --build-number="$APP_BUILD_NUMBER"

      - name: Rename APK for release
        shell: bash
        run: |
          cp apps/flutter/build/app/outputs/flutter-apk/app-release.apk \
            "apps/flutter/build/app/outputs/flutter-apk/XDRemux-Android-$TAG_VERSION.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/flutter/build/app/outputs/flutter-apk/XDRemux-Android-${{ env.TAG_VERSION }}.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, windows-arm64, android]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          # Tags carrying a -suffix (v0.1.9-pre.1) publish as pre-release so
          # they don't become /releases/latest or trigger in-app update checks.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: tools/installer/RELEASE_NOTES_${{ github.ref_name }}.md
          files: |
            dist/windows-installer/XDRemux-Windows-*-Setup.exe
            dist/windows-arm64-installer/XDRemux-Windows-arm64-*-Setup.exe
            dist/android-apk/XDRemux-Android-*.apk
