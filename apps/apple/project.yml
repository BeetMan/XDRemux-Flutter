# xcodegen spec for the native Apple app. Generate the Xcode project with:
#
#   cd apps/apple && xcodegen generate
#
# The .xcodeproj is ignored by Git; this file is the source of truth.
# Prerequisite: xdremux/rust/build_apple.sh has produced
# Frameworks/XDRemuxCore.xcframework (also ignored).
name: XDRemux
options:
  bundleIdPrefix: io.github.beetman
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  XDRemuxKit:
    path: Packages/XDRemuxKit
targets:
  XDRemux:
    type: application
    # One multiplatform target; platform differences live behind #if os().
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: XDRemuxKit
        product: XDRemuxKit
      - package: XDRemuxKit
        product: XDRemuxModel
      # iOS share sheet entry; embedded only in the iOS build.
      - target: XDRemuxShare
        embed: true
        platformFilter: iOS
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: XDRemux
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.photography
        # Viewer-rank document types: Finder "Open With", Dock drop, iOS "Open in".
        CFBundleDocumentTypes:
          - CFBundleTypeName: HEIF image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.heic, public.heif]
          - CFBundleTypeName: JPEG image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg]
        NSPhotoLibraryAddUsageDescription: 转换结果写入照片库需要此权限。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/XDRemux.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Inbox shared with the Share Extension (iOS); harmless on macOS.
        com.apple.security.application-groups: [group.io.github.beetman.xdremux.swiftui]
    settings:
      base:
        # Independent identity from the Flutter app (io.github.beetman.xdremux),
        # so both can be installed side by side (plan §5).
        PRODUCT_BUNDLE_IDENTIFIER: io.github.beetman.xdremux.swiftui
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        GENERATE_INFOPLIST_FILE: false
        # x265 is C++; the Rust staticlib carries no link flags of its own.
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        # macOS: no app group (needs a development certificate to sign).
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/XDRemux-macOS.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "-"

  XDRemuxShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: App/Platform/SharedInbox.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: XDRemux
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # xcodegen regenerates Info.plist from here, so the extension point
        # lives in this file rather than in a hand-written plist.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            PHSupportedMediaTypes: [Image]
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsFileWithMaxCount: 100
    entitlements:
      path: ShareExtension/XDRemuxShare.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.beetman.xdremux.swiftui]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.beetman.xdremux.swiftui.share
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "-"
