[package]
name = "xdremux-core"
version = "0.4.7"
edition = "2021"
authors = ["BeetMan"]
license = "MIT"
description = "XDRemux cross-platform HEIC conversion core (Rust)"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# Custom cfgs emitted by build.rs for the HEVC backend it compiled in
# (XDREMUX_HEVC_BACKEND): `xdremux_hevc_x265` for the default static-linked
# x265 encoder, `xdremux_ffmpeg_fallback` for the ffmpeg subprocess fallback.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(xdremux_hevc_x265)", "cfg(xdremux_ffmpeg_fallback)", "cfg(xdremux_gm_420)"] }

[dependencies]
heif-oxide = "0.1.0"
rust_h265 = "0.1.0"
jpeg-decoder = "0.3"
quick-xml = "0.42"
serde_json = "1.0"
zstd = "0.13"
png = "0.17"

[features]
default = []
# Native SDR decode fallback only; not an alternate HDR/container engine.
# Requires target-built shared libheif >= 1.23.4 at XDREMUX_LIBHEIF_PREFIX.
libheif-decoder = []

[dev-dependencies]
sha2 = "0.10"

[build-dependencies]
cc = "1"
