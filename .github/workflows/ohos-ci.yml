name: OHOS smoke (Rust core)

# OHOS smoke check: build the Rust core for aarch64-unknown-linux-ohos on
# the public OpenHarmony SDK. This is the CI-able part of the OHOS support;
# the full hap build needs a DevEco environment (hvigor engine bootstrap is
# DevEco-shaped) - see docs/research/harmonyos-support.md §0.8.

on:
  workflow_dispatch:
  push:
    paths:
      - 'xdremux/rust/**'
      - 'tools/ohos/**'
      - '.github/workflows/ohos-ci.yml'

jobs:
  ohos-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenHarmony SDK
        id: ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: '6.1'
          fixup-path: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Build Rust core for OHOS
        run: |
          set -euxo pipefail
          if [ ! -f xdremux/rust/vendor/x265/source/CMakeLists.txt ]; then
            git clone --depth 1 --branch 4.2 \
              https://bitbucket.org/multicoreware/x265_git.git \
              xdremux/rust/vendor/x265
            mkdir -p xdremux/rust/vendor/x265/include
            cp xdremux/rust/vendor/x265/source/x265.h \
              xdremux/rust/vendor/x265/include/x265.h
          fi
          OHOS_NATIVE="${{ steps.ohos-sdk.outputs.ohos_sdk_native }}" \
            bash xdremux/rust/build_ohos.sh
          file target/aarch64-unknown-linux-ohos/release/libxdremux_core.so
